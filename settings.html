<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>语音设置 · 英语例句训练器</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="settings-body">
    <main class="settings-card">
      <a class="settings-back" href="index.html">‹ 返回</a>
      <h1>语音设置</h1>
      <p class="settings-intro">选择 Kokoro 美式英语音色。更改后，答题页会使用对应音频。</p>

      <label class="setting-row">
        <span>美式英语语音</span>
        <select id="voice-select" aria-label="美式英语音色">
          <option value="am_echo">🇺🇸 🚹 Echo</option>
        </select>
      </label>

      <label class="setting-row setting-range">
        <span>语速 <output id="rate-value">0.85×</output></span>
        <input id="rate-input" type="range" min="0.5" max="1.5" step="0.05" value="0.85" />
      </label>

      <label class="setting-row">
        <span>重复播放</span>
        <select id="repeat-input">
          <option value="1">1 遍</option><option value="2">2 遍</option>
          <option value="3">3 遍</option><option value="5">5 遍</option>
        </select>
      </label>

      <label class="setting-row">
        <span>每遍间隔</span>
        <select id="pause-input">
          <option value="0">0 秒</option><option value="1">1 秒</option>
          <option value="2">2 秒</option><option value="3">3 秒</option>
        </select>
      </label>

      <p id="voice-note" class="voice-note" role="status" aria-live="polite"></p>
      <button id="test-voice" class="primary-button" type="button">试听所选音色（第 1 题）</button>
      <a class="secondary-link settings-done" href="index.html">完成</a>
    </main>
    <script src="src/settings.bundle.js"></script>
  </body>
</html>
